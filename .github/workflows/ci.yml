name: تدفّق — اختبار وبناء

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Engine, torrent and data tests
        run: chmod +x gradlew && ./gradlew :engine:test :torrent:test :data:testDebugUnitTest --no-daemon
      - name: App tests (Robolectric)
        run: ./gradlew :app:testGithubDebugUnitTest --no-daemon
      - name: Android Lint (release)
        run: ./gradlew :app:lintGithubRelease :app:lintPlayRelease --no-daemon
      - name: Build APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubRelease --no-daemon
      # AGP لا يسمح بتقسيم المعماريات أثناء بناء AAB، لذا أمر منفصل
      - name: Build AAB
        run: ./gradlew :app:bundlePlayRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          # الاسم يحمل الـ commit، وأسماء الملفات تحمل versionName وversionCode والـ commit
          name: tadaffuq-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab

  secrets:
    name: فحص الأسرار
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
      - name: لا مفاتيح توقيع في المستودع
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore|p12)$|keystore\.properties$'; then echo "signing material committed"; exit 1; fi

  dependencies:
    name: فحص الاعتماديات
    runs-on: ubuntu-latest
    # يرسل شجرة الاعتماديات إلى GitHub فتظهر تنبيهات Dependabot للثغرات المعروفة
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@v4
