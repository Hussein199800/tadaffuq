name: تدفّق — اختبار وبناء

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Engine, torrent and data tests
        run: chmod +x gradlew && ./gradlew :engine:test :torrent:test :data:testDebugUnitTest --no-daemon
      - name: App tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tadaffuq-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
