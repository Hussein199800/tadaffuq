name: تدفّق — حزم الإصدار

# يدوي فقط: يبني APK (نسخة GitHub بالتحديث من داخل التطبيق) وAAB (نسخة Play) موقّعين مع بصماتهما.
# لا ينشر في المتجر أبداً. إنشاء إصدار على GitHub (يقرؤه التحديث داخل التطبيق) فقط إن اختار صاحب المشروع «publish».
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "أنشئ إصدار GitHub بالوسم v<الإصدار> وأرفق الحزم (يصل التحديث للمستخدمين)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Tests (quality gate)
        run: chmod +x gradlew && ./gradlew :engine:test :torrent:test :data:testDebugUnitTest :app:testGithubDebugUnitTest --no-daemon
      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.TADAFFUQ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::أضف السر TADAFFUQ_KEYSTORE_BASE64 وTADAFFUQ_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tadaffuq.jks"
          echo "path=$RUNNER_TEMP/tadaffuq.jks" >> "$GITHUB_OUTPUT"
      - name: Build signed APKs and AAB
        env:
          TADAFFUQ_KEYSTORE: ${{ steps.sign.outputs.path }}
          TADAFFUQ_KEYSTORE_PASSWORD: ${{ secrets.TADAFFUQ_KEYSTORE_PASSWORD }}
          TADAFFUQ_KEY_ALIAS: tadaffuq
        run: |
          ./gradlew :app:assembleGithubRelease :app:cyclonedxBom --no-daemon
          ./gradlew :app:bundlePlayRelease --no-daemon
      - name: Collect and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*.apk dist/
          cp app/build/outputs/bundle/playRelease/*.aab dist/
          cp app/build/reports/tadaffuq-sbom.json dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tadaffuq-release
          path: dist/
      - name: Publish GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          NOTES=$(awk "/^## $VERSION /{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::الإصدار $TAG موجود؛ ارفع رقم الإصدار أولاً"; exit 1; fi
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS dist/tadaffuq-sbom.json --target "$GITHUB_SHA" --title "تدفّق $VERSION" --notes "${NOTES:-تدفّق $VERSION}"
