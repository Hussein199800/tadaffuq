name: تدفّق — حزم الإصدار

# يدوي فقط: يبني APK وAAB موقّعين مع بصماتهما كملفات Artifacts.
# لا ينشر في المتجر ولا ينشئ إصداراً على GitHub؛ ذلك بموافقة صاحب المشروع.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Tests (quality gate)
        run: chmod +x gradlew && ./gradlew :engine:test :torrent:test :data:testDebugUnitTest :app:testDebugUnitTest --no-daemon
      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.TADAFFUQ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::أضف السر TADAFFUQ_KEYSTORE_BASE64 وTADAFFUQ_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tadaffuq.jks"
          echo "path=$RUNNER_TEMP/tadaffuq.jks" >> "$GITHUB_OUTPUT"
      - name: Build signed APKs and AAB
        env:
          TADAFFUQ_KEYSTORE: ${{ steps.sign.outputs.path }}
          TADAFFUQ_KEYSTORE_PASSWORD: ${{ secrets.TADAFFUQ_KEYSTORE_PASSWORD }}
          TADAFFUQ_KEY_ALIAS: tadaffuq
        run: |
          ./gradlew :app:assembleRelease :app:cyclonedxBom --no-daemon
          ./gradlew :app:bundleRelease --no-daemon
      - name: Collect and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/reports/tadaffuq-sbom.json dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tadaffuq-release
          path: dist/
